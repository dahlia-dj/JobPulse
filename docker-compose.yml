x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  # Chromium (Playwright, connecteur WTTJ) a besoin de plus que les 64 Mo de
  # /dev/shm alloués par défaut par Docker. Le flag --disable-dev-shm-usage
  # dans wttj.py couvre déjà ce cas, mais on augmente aussi la limite ici en
  # sécurité (defense in depth, coûte juste un peu de RAM hôte).
  shm_size: "1gb"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Europe/Paris"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Variables applicatives lues par les DAGs / plugins (extraction, MinIO, DWH)
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
    MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
    POSTGRES_DWH_HOST: postgres
    POSTGRES_DWH_PORT: 5432
    POSTGRES_DWH_DB: ${POSTGRES_DWH_DB}
    POSTGRES_DWH_USER: ${POSTGRES_USER}
    POSTGRES_DWH_PASSWORD: ${POSTGRES_PASSWORD}
    FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID}
    FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET}
    FRANCE_TRAVAIL_SCOPE: ${FRANCE_TRAVAIL_SCOPE}
    ADZUNA_APP_ID: ${ADZUNA_APP_ID}
    ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
    ADZUNA_COUNTRY: ${ADZUNA_COUNTRY}
    SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT}
    SCRAPE_DELAY_SECONDS: ${SCRAPE_DELAY_SECONDS}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:

  postgres:
    image: postgres:16-alpine
    container_name: pfe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
      POSTGRES_DWH_DB: ${POSTGRES_DWH_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_AIRFLOW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # ⚠️ MinIO Inc. a cessé de publier ses images officielles sur Docker Hub
    # en 2026 (repo minio/minio archivé, pivot commercial vers "AIStor").
    # On utilise donc un mirroir communautaire qui republie les mêmes
    # binaires officiels (open source, AGPLv3) à chaque release GitHub :
    # https://hub.docker.com/r/alpine/minio -- vérifier
    # https://hub.docker.com/r/alpine/minio/tags pour un tag plus récent
    # si besoin, mais toujours épingler une version précise (pas de tag
    # "latest" fourni par ce mirroir).
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: pfe_minio
    user: "0:0" 
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    # Migration de la base Airflow, création de l'utilisateur admin, ET
    # création des buckets MinIO -- cette dernière étape se fait ici via
    # notre propre client Python (bibliothèque "minio", déjà utilisée par
    # storage/minio_client.py) plutôt que via l'image minio/mc, elle aussi
    # discontinuée par MinIO Inc. (voir commentaire sur le service minio
    # ci-dessus). Évite une dépendance à une image tierce en plus du
    # mirroir déjà utilisé pour le serveur.
    <<: *airflow-common
    container_name: pfe_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --username ${AIRFLOW_ADMIN_USER}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
        --lastname ${AIRFLOW_ADMIN_LASTNAME}
        --role Admin
        --email ${AIRFLOW_ADMIN_EMAIL} || true &&
        python -c "import sys; sys.path.insert(0, '/opt/airflow/plugins');
        from storage.minio_client import ensure_bucket;
        import os;
        ensure_bucket(os.environ['MINIO_BUCKET_BRONZE']);
        ensure_bucket(os.environ['MINIO_BUCKET_SILVER']);
        print('Buckets MinIO créés avec succès.')
        "
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: pfe_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: pfe_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
