[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b26"
textColor = "#e6edf3"
font = "sans serif"

[server]
maxUploadSize = 5  # Mo : suffisant pour un CV en PDF

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"  # masque le bouton « Deploy » et le menu développeur
